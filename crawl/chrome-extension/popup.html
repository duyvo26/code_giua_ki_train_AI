<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 380px; font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; color: #1877f2; }
    button {
      width: 100%; padding: 9px; font-size: 13px; font-weight: 600;
      background: #1877f2; color: #fff; border: none; border-radius: 6px; cursor: pointer;
      margin-bottom: 6px;
    }
    button:hover { background: #166fe5; }
    button:disabled { background: #a5c9f7; cursor: wait; }
    button.secondary { background: #e4e6eb; color: #1c1e21; }
    button.secondary:hover { background: #d8dadf; }
    button.danger { background: #fdecea; color: #c5221f; }
    button.danger:hover { background: #fad2cf; }
    #hint { font-size: 11px; color: #888; margin-bottom: 8px; }
    label { display: block; font-size: 12px; color: #333; margin-bottom: 4px; }
    input[type="number"] {
      width: 100%; padding: 6px 8px; font-size: 13px; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 6px; margin-bottom: 8px;
    }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 6px 8px; font-size: 13px; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 6px; margin-bottom: 8px;
    }
    textarea {
      width: 100%; padding: 6px 8px; font-size: 12px; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 6px; margin-bottom: 8px;
      font-family: monospace; resize: vertical;
    }
    .checkbox { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #333; margin-bottom: 8px; cursor: pointer; }
    .checkbox input { width: auto; margin: 0; }
    .section-title { font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; margin: 10px 0 4px; }
    #status { margin-top: 6px; font-size: 12px; color: #555; min-height: 16px; }
    #result { margin-top: 8px; font-size: 11px; word-break: break-all; }
    #result .item { padding: 6px 0; border-bottom: 1px solid #eee; }
    #result .url { color: #1877f2; }
    #result .badge { margin-top: 2px; font-weight: 600; }
    #result .badge-ok { color: #188038; }
    #result .badge-error { color: #d93025; }
    #result .badge-wait { color: #b06000; }
    #result .preview { color: #555; margin-top: 2px; max-height: 40px; overflow: hidden; }
    .error { color: #d93025; }
    .ok { color: #188038; }
    #author { margin-top: 10px; font-size: 11px; color: #aaa; text-align: center; }
  </style>
</head>
<body>
  <h1>FB Group URL Grabber</h1>
  <div id="hint">Bam "Quet 1 trang" -> tu cuon trang hien tai, thu thap cong don (loc trung) roi gui web tu phan tich + gui bot. "Quet auto nhieu trang" -> mo tung trang da cau hinh.</div>
  <label for="postCount">So bai co binh luan cong khai can tim:</label>
  <input type="number" id="postCount" min="1" max="50" value="5">
  <label for="loadWait">Thoi gian cho load moi lan cuon (ms):</label>
  <input type="number" id="loadWait" min="500" max="10000" step="500" value="3000">
  <div class="section-title">Cau hinh web</div>
  <label for="webConfigJson">Dan JSON tu web (nut "Copy config" - tab Cau hinh API Key):</label>
  <input type="text" id="webConfigJson" placeholder='{"webUrl":"https://xxx.trycloudflare.com","apiKey":"32-ky-tu"}'>
  <button id="saveConfig" class="secondary">Luu cau hinh web</button>
  <button id="scan">Quet 1 trang + gui web</button>
  <div class="section-title">Auto quet nhieu trang</div>
  <label for="autoUrls">Trang auto (1 URL/dong - tu dong mo de quet):</label>
  <textarea id="autoUrls" rows="3" placeholder="https://www.facebook.com/groups/762609615053439"></textarea>
  <label for="autoDelay">Delay moi trang truoc khi quet (giay):</label>
  <input type="number" id="autoDelay" min="1" max="60" value="5">
  <label class="checkbox"><input type="checkbox" id="autoCloseTab" checked> Tu dong dong tab sau khi xong</label>
  <button id="runAuto">Quet auto nhieu trang</button>
  <button id="stopAuto" class="secondary" style="display:none">Dung quet</button>
  <div id="status">Chua co du lieu. Mo trang group bat ky.</div>
  <div id="result"></div>
  <button id="download" class="secondary" disabled>Tai file fb_posts_content.txt</button>
  <button id="clearPosts" class="secondary danger">Xoa bai viet cu</button>
  <div id="author">Tac gia: duyvo26</div>
  <script src="popup.js"></script>
</body>
</html>
